name: Build & Release PurrParse Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Ensure GitHub Release Exists
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "PurrParse $TAG" --generate-notes
          fi

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon (arm64)
            os: macos-latest
            cmd: npm run desktop:build
            pattern: dist-electron/*.dmg
          - label: macOS Intel (x64)
            os: macos-15-intel
            cmd: npm run desktop:build:mac-x64
            pattern: dist-electron/*.dmg
          - label: Windows (x64 & arm64)
            os: windows-latest
            cmd: npm run desktop:build:win
            pattern: dist-electron/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck & tests
        run: |
          npm run typecheck
          npm test

      - name: Package PurrParse Desktop (${{ matrix.label }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.cmd }}

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          shopt -s nullglob
          FILES=(${{ matrix.pattern }})
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No installer artifacts matched ${{ matrix.pattern }}" >&2
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
