name: Build & Release PurrParse Desktop

on:
  push:
    tags:
      - "v*"
      - "win-v*"
      - "mac-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v1.1.12, win-v1.1.12, mac-v1.1.12)"
        required: true
        default: "v1.1.12"
      target_os:
        description: "Target OS build scope (auto infers from tag prefix/suffix win-/mac-)"
        type: choice
        required: true
        default: "auto"
        options:
          - auto
          - all
          - win
          - mac

permissions:
  contents: write

jobs:
  prepare-release:
    name: Ensure GitHub Release Exists
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_mac: ${{ steps.meta.outputs.build_mac }}
      build_win: ${{ steps.meta.outputs.build_win }}
      target_platforms: ${{ steps.meta.outputs.target_platforms }}
      is_platform_only: ${{ steps.meta.outputs.is_platform_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag & platform scope
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            DISPATCH_OS="${{ github.event.inputs.target_os }}"
          else
            TAG="${GITHUB_REF_NAME}"
            DISPATCH_OS="auto"
          fi

          SCOPE="$DISPATCH_OS"
          if [[ "$SCOPE" == "auto" ]]; then
            LOWER_TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER_TAG" =~ ^win[-_]?v?[0-9] ]] || [[ "$LOWER_TAG" =~ -(win|windows)([.-]|$) ]]; then
              SCOPE="win"
            elif [[ "$LOWER_TAG" =~ ^mac(os)?[-_]?v?[0-9] ]] || [[ "$LOWER_TAG" =~ -(mac|macos|darwin)([.-]|$) ]]; then
              SCOPE="mac"
            else
              SCOPE="all"
            fi
          fi

          CLEAN_VER=$(echo "$TAG" | sed -E 's/^(win|windows|mac|macos|darwin|linux)[-_]?//I; s/^v+//I; s/-(win|windows|mac|macos|darwin|linux)$//I')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"

          if [[ "$SCOPE" == "win" ]]; then
            echo "build_mac=false" >> "$GITHUB_OUTPUT"
            echo "build_win=true" >> "$GITHUB_OUTPUT"
            echo "target_platforms=win32" >> "$GITHUB_OUTPUT"
            echo "is_platform_only=true" >> "$GITHUB_OUTPUT"
          elif [[ "$SCOPE" == "mac" ]]; then
            echo "build_mac=true" >> "$GITHUB_OUTPUT"
            echo "build_win=false" >> "$GITHUB_OUTPUT"
            echo "target_platforms=darwin" >> "$GITHUB_OUTPUT"
            echo "is_platform_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_mac=true" >> "$GITHUB_OUTPUT"
            echo "build_win=true" >> "$GITHUB_OUTPUT"
            echo "target_platforms=darwin,win32" >> "$GITHUB_OUTPUT"
            echo "is_platform_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          IS_PLATFORM_ONLY="${{ steps.meta.outputs.is_platform_only }}"
          cat <<'EOF' > /tmp/release-notes.md
          ### v1.1.12 主要更新（前 5 段优先译妥 · 隐藏 Win 右侧白条 · 公式排版修复 · 分端独立更新）

          - **「前 5 段预译 + 第 6 段起严格逐段」防打断生成节奏**（[chunk-orchestrator.ts](src/core/engine/chunk-orchestrator.ts)、[llm-adapters.ts](src/core/engine/llm-adapters.ts)）：
            - 全局骨架完成时先锁定阅读入口，开篇前 5 段以稳健微批（`3 + 2`）完整译妥后才解锁「进入阅读」，确保点进文章时开篇 5 段立即可读，不再被占位框打断。
            - 默认标准模式下，第 6 段起切换为 `concurrency = 1` 逐段（1 段/次）顺次生成，大幅降低限流与断连报错率，并将多段批次超时放宽至 65 秒、单段微批保留 50 秒响应。
          - **隐藏并融合 Windows 最右侧古典滚动条**（[globals.css](src/app/globals.css)、[proximity-sidebar.tsx](src/components/ui/proximity-sidebar.tsx)）：
            - 消除 Windows 主界面右侧白色古典 Win32 滚动条，仅在内部弹窗与抽屉保留 6px 细圆角滚动条。
            - 右侧 `ProximitySidebar` 刻度尺支持按住左键上下拖动平滑滚动，同时完整保留鼠标单击跳转章节刻度功能。
          - **`TENSOR / STATE FLOW` 与行内公式排版修复**（[flow-math.ts](src/core/engine/flow-math.ts)、[math-text.tsx](src/workbench-ui/math-text.tsx)、[DualColumnRow.tsx](src/workbench-ui/DualColumnRow.tsx)、[html-compiler.ts](src/exporters/html-compiler.ts)）：
            - 自动将流向卡片与已保存文档中的裸文本公式（如 `x_t[H,W,3]`、`L_distill = ||P(F_t) - G_t||^2`、`d_z << D`、`ẑ_{t+1:t+H}`、`√d_k`）规范化为标准 KaTeX 公式（同时避免误伤 `QK^T`、`QW_i^Q`、`d_{\text{model}}` 与源码状态链），并美化 `[分析推断]` 等认识论角标徽章。
          - **极简重构「新建解析」弹窗**（[IngestionStudioModal.tsx](src/workbench-ui/IngestionStudioModal.tsx)）：
            - 移除编号步骤与冗余文字，收拢为分段模式条 + 单一输入卡片 + 嵌入式 `+ 上传文件` 按钮 + 折叠式可选自定义背景，支持三套主题变量与 `Esc` 快捷关闭。
          - **支持按操作系统分端独立更新**（[updater.cjs](electron/updater.cjs)、[app-updater.ts](src/core/engine/app-updater.ts)、[release-desktop.yml](.github/workflows/release-desktop.yml)、[landing/app.js](landing/app.js)）：
            - 客户端升级与官网下载切换为检索 `/releases?per_page=10`，支持 `win-v*` 与 `mac-v*` 独占标签与产物隔离；待双端均升级至 `v1.1.12` 后，后续单端修复将不再迫使另一端同步更新。
          - **注**：由于本次升级同时包含桌面端更新器逻辑调整（`shellHash` 变更），从 `v1.1.11` 及更早版本升级时将在应用内自动回退下载 `v1.1.12` 完整安装包完成一次性升级。

          ### v1.1.11 主要更新（Windows 一体化无边框顶栏重构）

          - **Windows 版采用一体化 Window Controls Overlay 顶栏设计**：
            - 移除传统双层标题栏与“文件 / 编辑 / 视图 / 窗口 / 帮助”菜单栏，主界面直接延伸至窗口顶部边缘，`— □ ✕` 窗口控制按钮透明融合在 48px 液态毛玻璃顶栏最右侧；顶栏空白处可自由拖拽移动窗口（仍保留 `Ctrl+R`、`F12`、`F11` 快捷键）。
            - 支持 `稿纸 / 夜空 / 纯白` 三态主题动态同步：切换深色夜空主题时，Windows 右上角 `— □ ✕` 按钮符号自动切换为高亮浅色，保证高对比清晰可读；同时为通读模式与右侧 AI 划词抽屉补充顶部避让空间。
          - **注**：由于本次升级涉及桌面主进程窗口壳层架构调整（`shellHash` 变更），Windows / macOS 从旧版升级时会在应用内自动回退下载 `v1.1.11` 完整安装包完成一次性升级。

          ### v1.1.10 主要更新（支持 v1.1.8 / v1.1.9 增量热更新）

          - **彻底规范翻译 vs 拆解职责，中文原文不再多余生成“假译文/摘要”**：
            - 在 [shared-schemas.ts](src/core/contracts/shared-schemas.ts) 新增 `isPrimarilyChineseProse()` 语言判定：对中文文章或中文口播段落，自动跳过 `secondaryBlockText`（不再生成重复复述或总结框），仅对非中文/外文段落生成中文翻译。
            - 重写 [cognitive-essay/prompts.ts](src/plugins/cognitive-essay/prompts.ts)、[academic-paper/prompts.ts](src/plugins/academic-paper/prompts.ts) 与 [chunk-orchestrator.ts](src/core/engine/chunk-orchestrator.ts) 极速模式提示词：明确禁止在 `secondaryBlockText` 中把外文对话/段落写成第三人称总结或评述，要求逐句忠实直译并保留 `[MM:SS]` 时间锚点与人称对话口吻；所有分析与点评统一归位右侧 `notes[]`。
            - 更新离线启发式兜底逻辑：中文段落 `secondaryBlockText` 为空，外文段落不再冒充摘要输出 `[核心句提炼]`。

          ### v1.1.9 主要更新（支持 v1.1.8 增量热更新）

          - **彻底修复长视频/播客转写有缓存却仍提示无正文的问题**：
            - 修复 `mlx_whisper` 在部分长语音段落写出非标准 JSON 值（`avg_logprob: NaN` / `Infinity`）导致 Node `JSON.parse()` 静默抛错并返回 `null` 的严重 bug，在 [v2t-bridge.ts](src/core/engine/v2t-bridge.ts) 新增词法安全的 `parseLenientJson` 与 `.srt`/`.vtt` 兜底解析，并在 [scripts/v2t.py](scripts/v2t.py) 落盘前自动清理非有限浮点值。
            - 改善纯英文/双语播客转写段落拼接，英文段落不再错误插入中文全角逗号，并为超长视频（如 60 分钟、90+ 单元）增加全局均匀抽样以覆盖全文结构。
          - **大幅增强 API TLS/网络抖动自动重试 + 新增失败段落旁「原地重试」兜底按钮**：
            - 在 [llm-adapters.ts](src/core/engine/llm-adapters.ts) 为瞬时 TLS 断连、socket 断开、429/5xx 等网关抖动新增最多 3 次带随机抖动的指数退避重连，配合 [chunk-orchestrator.ts](src/core/engine/chunk-orchestrator.ts) 拆批与单段回退。
            - 新增 `/api/retry-units` 端点与 [DualColumnRow.tsx](src/workbench-ui/DualColumnRow.tsx) 失败翻译卡片旁的 **`↻ 重试本段翻译`** 及 **`一键重试全部失败段`** 按钮，局部失败无需重跑整篇文档。

          ### v1.1.8 主要更新

          - **修复大批量段落偶发漏译（自动拆半重试）**：当并发解析中单个批次（如 8 段）偶发限流/超时/校验异常时，[chunk-orchestrator.ts](src/core/engine/chunk-orchestrator.ts) 自动退避并将该批拆分为两小批逐个重试，避免直接丢弃整批译文。
          - **恢复并打包跨平台「视频转逐字稿正文」(`v2t.py`) + 解除 5 分钟服务端超时**：
            - 将 `scripts/v2t.py` 直接随包内置入 `standalone/scripts/`（后续增量热更新也可同步升级）并支持 macOS + Windows Python 环境探测与 UTF-8 编码。
            - 修复此前超过 5~6 分钟的长视频本地 ASR 转写（如 ~60 分钟抖音播客）因 Node 22 默认 `requestTimeout=300s` 及 6 分钟桥接超时导致中断、随后静默回退“未公开字幕”提示的问题；现已解除嵌入式 Next.js 服务端请求超时、将 `v2t` 超时放宽至 25 分钟、在预处理阶段推送心跳进度并保留完整异常日志。

          ### v1.1.7 主要更新

          - **双轨增量补丁更新（~3–5 MB 秒级热切换）**：每次发版同步产出轻量 `PurrParse-patch-<version>.tar.gz` 与 `PurrParse-patch-manifest.json`（含 `shellHash` / `depsHash` 指纹与 SHA-256 校验）。从 `v1.1.7` 起，纯业务层（前端 UI、Prompt、模型适配器、API）更新只需下载几 MB 增量补丁解压到 `userData/hot-standalone` 并自动重启，不再破坏 macOS 签名；当 Electron 壳或依赖树变更时自动安全回退全量安装包，且内置启动崩溃自动回滚保护。

          ### v1.1.6 主要更新

          - **修复极速模式 / 长文顶层脚手架截断报错 (`No object generated`)**：
            - 将 `top-model` / `batch` / `bottom` 的极速与标准模式输出上限统一提升至 `8192` tokens，解除 4096 截断上限。
            - 优化三模式 `topModelPrompt`，显式传入逻辑章节 `sectionId` 列表，避免模型将单个段落 `unitId`（如 `sec-1-p1`）误拆为十余个冗长章节。
            - 新增结构化截断 JSON 自动修复器 `tryRepairTruncatedJson`，即使极端情况下仍触发 `max_tokens` 截断也能自动回退至完整闭合节点并校验入库。

          ### v1.1.5 主要更新

          - **OpenAI 兼容 / DeepSeek 中转流式优先引擎**：针对第三方中转站及推理模型在非流式（`stream: false`）长文本生成时容易超时或返回空 `choices: []` 的问题，所有 OpenAI 兼容 / DeepSeek / 自定义代理默认切换为流式 SSE（`stream: true`）并发出结构化 Schema 约束提示，彻底绕开中转站非流式缓冲超时并跳过冗余等待；流式转换器同时兼容心跳空帧、`reasoning_content` 推理段兜底提取、缺失 `index` 补全与空流诊断提示。

          ### v1.1.4 主要更新

          - **OpenAI 兼容 / DeepSeek 中转网关响应规范化**：修复中转网关或模型返回空 `choices: []` 时触发 `Cannot read properties of undefined (reading 'message')` 崩溃的问题，改为清晰的中文错误提示；支持自动剥离/拼接 `/v1` 路径、合并多 choice 推理与正文、将非流式请求意外返回的 `text/event-stream` SSE 响应还原为标准 JSON、显式暴露 HTTP 200 `{ error }` 包裹异常，并在认证/限流/超时错误时跳过冗余的二次降级调用。
          - **队列与流式错误健壮性**：增强 `/api/analyze` 服务端异常日志与客户端 NDJSON 流及后台解析队列的兜底错误提示。

          ### v1.1.3 主要更新

          - **仓库名称对齐 `PurrParse`**：App 内检查更新源、官网与文档全部迁移至 `lyz-wave/PurrParse`，同时增强重定向降级探针（支持多跳 301/302 自动跟随），确保后续版本检查更新与增量升级稳定直达。
          - **包含完整核心能力**：极速/标准并发解析（4–5 并发）、后台多篇并行任务坞、macOS 自动替换 `.app` 重启与 Windows NSIS 一键升级。

          ### 安装与首次运行说明

          - **macOS（Apple Silicon `arm64` / Intel `x64`）**：本版本为开源自签名版（未购 Apple 开发者公证证书）。通过浏览器手动下载拖入「应用程序」后，若触发“**已损坏，无法打开**”提示，在终端运行一次下方命令即可正常启动：
            ```sh
            xattr -cr /Applications/PurrParse.app
            ```
          - **Windows（`x64` / `ARM64`）**：若安装或运行前触发 Microsoft Defender SmartScreen 安全拦截，点击「**更多信息**」→「**仍要运行**」即可。已包含 `.next/standalone` 依赖树扁平化（移除超深 `.pnpm` 嵌套路径并解决 `MAX_PATH` 限制）及启动环境诊断增强。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$IS_PLATFORM_ONLY" == "true" ]]; then
              gh release edit "$TAG" --notes-file /tmp/release-notes.md
            else
              gh release edit "$TAG" --notes-file /tmp/release-notes.md --latest
            fi
          else
            LATEST_FLAG="--latest"
            if [[ "$IS_PLATFORM_ONLY" == "true" ]]; then
              LATEST_FLAG="--latest=false"
            fi
            gh release create "$TAG" --title "PurrParse $TAG" --notes-file /tmp/release-notes.md "$LATEST_FLAG"
          fi

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    if: (matrix.platform == 'mac' && needs.prepare-release.outputs.build_mac == 'true') || (matrix.platform == 'win' && needs.prepare-release.outputs.build_win == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon (arm64)
            os: macos-latest
            platform: mac
            commands: "npx electron-builder --mac dmg --arm64 --publish never && node scripts/build-patch-bundle.mjs"
            pattern: dist-electron/*.dmg dist-electron/PurrParse-patch-*.tar.gz dist-electron/PurrParse-patch-manifest.json
          - label: macOS Intel (x64)
            os: macos-15-intel
            platform: mac
            commands: "npx electron-builder --mac dmg --x64 --publish never"
            pattern: dist-electron/*.dmg
          - label: Windows (x64 & arm64)
            os: windows-latest
            platform: win
            commands: "npx electron-builder --win nsis --x64 --publish never && npx electron-builder --win nsis --arm64 --publish never"
            pattern: dist-electron/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align package version from release tag if needed
        shell: bash
        run: |
          RELEASE_VER="${{ needs.prepare-release.outputs.version }}"
          if [[ "$RELEASE_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            CURRENT_VER=$(node -p "require('./package.json').version")
            if [[ "$CURRENT_VER" != "$RELEASE_VER" ]]; then
              npm pkg set "version=$RELEASE_VER"
            fi
          fi

      - name: Run typecheck & tests
        run: |
          npm run typecheck
          npm test

      - name: Package PurrParse Desktop (${{ matrix.label }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PURRPARSE_TARGET_PLATFORMS: ${{ needs.prepare-release.outputs.target_platforms }}
        shell: bash
        run: |
          npm run build
          npm run desktop:prepare
          eval "${{ matrix.commands }}"

      - name: Smoke-test packaged standalone & signature (${{ matrix.label }})
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            APP_DIR=$(ls -d dist-electron/mac*/PurrParse.app | head -n 1)
            codesign --verify --deep --strict --verbose=2 "$APP_DIR"
            node scripts/verify-standalone.cjs "$APP_DIR/Contents/Resources/standalone" "$APP_DIR/Contents/MacOS/PurrParse"
          else
            node scripts/verify-standalone.cjs dist-electron/win-unpacked/resources/standalone dist-electron/win-unpacked/PurrParse.exe
            node scripts/verify-standalone.cjs dist-electron/win-arm64-unpacked/resources/standalone
          fi

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          shopt -s nullglob
          FILES=(${{ matrix.pattern }})
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No installer artifacts matched ${{ matrix.pattern }}" >&2
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
